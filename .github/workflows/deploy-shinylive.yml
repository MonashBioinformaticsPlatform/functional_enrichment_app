name: Build and deploy shinylive app

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Install via pak, which pulls prebuilt Ubuntu binaries from the
          # public Posit Package Manager (RSPM) configured above — this
          # avoids compiling from source, which fails on GitHub's runners
          # for packages needing system libraries that aren't preinstalled
          # (e.g. libcurl-dev, libuv-dev) and, worse, doesn't necessarily
          # fail the step: install.packages() only warns on a single
          # package failure rather than halting, so a broken install can
          # silently pass this step and only surface later as "there is
          # no package called '...'" during export.
          #
          # eulerr is pinned to 7.1.0 to match the version currently
          # published on the shinylive/webR wasm package repo
          # (https://repo.r-wasm.org/src/contrib/PACKAGES). shinylive's
          # dependency resolver reads the *locally installed* package's
          # DESCRIPTION to decide what to bundle, not the wasm repo's — if
          # CRAN's current eulerr (newer, with fewer declared deps) is
          # installed here instead, export succeeds but the deployed app
          # silently ships without eulerr's real runtime dependencies
          # (polyclip, GenSA, polylabelr) and breaks in the browser with
          # "there is no package called 'polyclip'". If this pin starts
          # failing, re-check the wasm repo's current eulerr version and
          # update it to match — don't just remove the pin.
          packages: |
            any::shinylive
            eulerr@7.1.0
            any::scales
          cache-version: 1

      - name: Export shinylive app
        # If this step prints "Package version mismatch" warnings, the
        # deployed app can build successfully here but still fail at
        # runtime in the browser with "there is no package called '...'"
        # — check the log for that warning if the deployed site ever
        # breaks despite a green build.
        run: |
          shinylive::export(appdir = ".", destdir = "site")
        shell: Rscript {0}

      - name: Sanity-check bundled packages
        # eulerr's real runtime deps (see the pin comment above) must be
        # present in the exported wasm package set, or the deployed app
        # will error at runtime the first time it draws a plot.
        run: |
          set -euo pipefail
          for pkg in eulerr polyclip GenSA polylabelr scales; do
            if [ ! -d "site/shinylive/webr/packages/$pkg" ]; then
              echo "::error::Expected package '$pkg' missing from site/shinylive/webr/packages/ — the exported app will likely fail at runtime. See the eulerr version-pin comment in this workflow."
              exit 1
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
