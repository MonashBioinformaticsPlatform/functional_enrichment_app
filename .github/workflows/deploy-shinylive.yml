name: Build and deploy shinylive app

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-shinylive-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy-shinylive.yml') }}
          restore-keys: |
            r-shinylive-${{ runner.os }}-

      - name: Install R package dependencies
        run: |
          install.packages(c("shinylive", "eulerr", "scales"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Export shinylive app
        # If this step prints "Package version mismatch" warnings, the
        # deployed app can build successfully here but still fail at
        # runtime in the browser with "there is no package called '...'"
        # — check the log for that warning if the deployed site ever
        # breaks despite a green build.
        run: |
          shinylive::export(appdir = ".", destdir = "site")
        shell: Rscript {0}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
